version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    # Skip releases less than a week old. Security updates aren't delayed.
    cooldown:
      default-days: 7
    groups:
      maven:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Keep the types on Node 24, the version CI and the Docker build use.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Move to a new Java or Node major version by hand, together with CI.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
