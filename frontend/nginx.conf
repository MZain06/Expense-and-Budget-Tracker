# Serves the built React app and passes /api calls on to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't show the nginx version in headers and error pages.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # Browser protections for every response. The locations below inherit these only because
    # none of them has an add_header of its own, which is why they use "expires" instead.
    # The policy lets pages load scripts, styles and fonts from this site only, and nothing
    # may show the app inside a frame.
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Built files have a hash in their names, so browsers can keep them for a year.
    location /assets/ {
        expires 1y;
    }

    # API calls go to the backend container, the same way Vite's dev server sends them to :8080.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Every other path is a page of the app: serve index.html and let React Router choose.
    # It's never cached, so a new version shows up straight away.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}