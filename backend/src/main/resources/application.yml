spring:
  application:
    name: expenses
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expenses}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

app:
  jwt:
    # Local development only. Real deployments must set JWT_SECRET (32+ characters).
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
    issuer: expense-tracker
    expiry: 1h